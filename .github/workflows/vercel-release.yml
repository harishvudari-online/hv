name: Deploy harishvudari.online

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-prod-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deploy entrypoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard existing Vercel project
        run: bash scripts/test-deploy-entrypoint.sh

      - name: Guard blog preview data
        run: bash scripts/test-blog.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (same gate as Vercel next build)
        run: npx next lint

  deploy:
    name: Deploy existing Vercel project
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Deploy to existing project
        run: bash scripts/deploy-vercel.sh

      - name: Verify production
        run: bash scripts/verify-production.sh
