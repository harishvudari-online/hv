<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">Evolution of Web Access Governance: robots.txt vs Blunt Blocks vs Agentic Web Protocol</title>
  <desc id="cmpDesc">Architectural comparison of legacy robots.txt, blunt IP blocking and CAPTCHAs, and the Agentic Web Protocol with agents.json as of 4 October 2026, comparing identity verification, capability negotiation, rate governance, and monetization.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Web Access Evolution: From Passive Crawling to Cryptographic Agent Protocols</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">The Agentic Web Protocol replaces unauthenticated scraping and blunt CAPTCHAs with cryptographic agent identity and agents.json.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#FF9B80" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#FF9B80" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Legacy robots.txt</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">1994 Static Crawler Standard</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Voluntary honor system</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Simple URL path string disallow</text>
  <text x="140" y="406" fill="#FFB088" font-family="Inter, Arial, sans-serif" font-size="15">Zero identity authentication</text>
  <text x="140" y="440" fill="#FFB088" font-family="Inter, Arial, sans-serif" font-size="15">No capability negotiation</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Blunt Blocking</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">2023 to 2026 Reactive Defenses</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Cloudflare CAPTCHA walls</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Fragile IP blocklists &amp; ASN bans</text>
  <text x="480" y="406" fill="#FFDF9E" font-family="Inter, Arial, sans-serif" font-size="15">Terms of Service popups</text>
  <text x="480" y="440" fill="#FFDF9E" font-family="Inter, Arial, sans-serif" font-size="15">High false positive rate</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.7"/>
  <text x="820" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Agentic Web Protocol</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">AWP 1.0 &amp; agents.json</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Cryptographic DID identity</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Granular capability scopes</text>
  <text x="820" y="406" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Structured rate envelopes</text>
  <text x="820" y="440" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">HTTP 402 native monetization</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the protocol transition. The Agentic Web Protocol provides the structured authentication, rate limits, and capability manifests required to govern autonomous AI agents across the open web.</text>
</svg>
