<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">World Model Architectures: Google Genie 3 vs Genie 2 and Video Generation Models</title>
  <desc id="cmpDesc">Architectural comparison of Google DeepMind Genie 3 interactive world model with Genie 2 and offline video generation models as of 28 September 2026, comparing resolution, frame rates, action latency, and training dynamics.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">World Models vs Video Generators: Real-Time Interactive Action</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Genie 3 closes the interactive latency loop, stepping past offline diffusion clips into navigable simulation.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Genie 3 (DeepMind)</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">16B Diffusion Transformer</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">720p at 30 fps stream</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Sub-50ms action response</text>
  <text x="140" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Continuous 3D physics state</text>
  <text x="140" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Autonomous robotics sandbox</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Genie 2 Baseline</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">11B Parameter Model</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">480p at 16 fps limit</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">120ms action latency</text>
  <text x="480" y="406" fill="#FFDC99" font-family="Inter, Arial, sans-serif" font-size="15">Short horizon drift (10-15s)</text>
  <text x="480" y="440" fill="#FFDC99" font-family="Inter, Arial, sans-serif" font-size="15">Platformer environment focus</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.55"/>
  <text x="820" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Offline Video Gen</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Veo 2, Sora, Kling</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">1080p high visual fidelity</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Zero real-time interactivity</text>
  <text x="820" y="406" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Minutes per generated clip</text>
  <text x="820" y="440" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Cinematic rendering only</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the interactive frontier. While video generators render passive sequences, world models simulate reactive physical reality for AI agents and humans.</text>
</svg>
