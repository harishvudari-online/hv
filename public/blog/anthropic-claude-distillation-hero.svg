  <text x="166" y="388" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">DeepSeek: 12.1M in 14 days</text>
  <text x="166" y="434" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Zhipu 3.4M + Xiaomi 400k</text>

