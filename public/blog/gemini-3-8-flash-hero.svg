<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gemini 3.8 Flash agent workhorse</title>
  <desc id="desc">Editorial illustration of Gemini 3.8 Flash as a cheap agent workhorse beside a restricted Flash Cyber lane.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="160" cy="80" r="230" fill="#00C2FF" fill-opacity="0.16"/>
  <circle cx="1060" cy="560" r="250" fill="#7CFFB2" fill-opacity="0.12"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Gemini 3.8 Flash: cheap agent workhorse</text>
  <text x="118" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">GA 2 Sep 2026  |  gemini-3.8-flash  |  $0.75 / $3.75 per 1M tokens through 2026</text>

  <rect x="118" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.6" stroke-width="2"/>
  <text x="148" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Gemini 3.8 Flash</text>
  <rect x="148" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="166" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">1,048,576 context, 65,536 max output</text>
  <text x="166" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Thinking: low, medium, high. No minimal.</text>
  <text x="166" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Default model for Antigravity agents</text>
  <text x="148" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">API, AI Studio, Gemini Enterprise, Search, Sheets</text>

  <rect x="622" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.65" stroke-width="2"/>
  <text x="652" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Gemini 3.8 Flash Cyber</text>
  <rect x="652" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="670" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Vulnerability find and automated patch</text>
  <text x="670" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Fairwind Program, trusted defenders only</text>
  <text x="670" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">CWE-Bench pass@1 47.2% vs Fable 5 47.8%</text>
  <text x="652" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Governments, critical infrastructure, maintainers</text>

  <text x="118" y="534" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="18">Third Flash release in six weeks. Same intro price. More tokens on hard loops.</text>
</svg>
