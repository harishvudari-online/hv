<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">OpenAI Jalapeño versus NVIDIA on watts, TCO, and shipping</title>
  <desc id="cmpDesc">Diagram comparing Jalapeño engineering samples with NVIDIA Blackwell and Vera Rubin on efficiency, cost, and availability.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Three scores, not one winner</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Jalapeño leads on watts in the published rows. Rubin still ships. TCO per token is roughly even.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#E85D4C" stroke-opacity="0.65"/>
  <text x="140" y="258" fill="#E85D4C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Watts</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Jalapeño A0: 700W rated</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Sustained at or below 550W</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">HBM4, 15.4 TB/s bandwidth</text>
  <text x="140" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">1.5x to 1.9x work per watt</text>
  <text x="140" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Tokens per MW beats Rubin rows</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="480" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">TCO</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Output tokens per $</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Roughly even with Vera Rubin</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Rubin uses MTP today</text>
  <text x="480" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Jalapeño is still STP only</text>
  <text x="480" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Speculative decode is leftover headroom</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.5"/>
  <text x="820" y="258" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Shipping</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">A0 engineering samples</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Small deploy by end of 2026</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Volume ramp across 2027</text>
  <text x="820" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Rubin already ships to customers</text>
  <text x="820" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">B0 claims ~25% more perf/W</text>
</svg>
