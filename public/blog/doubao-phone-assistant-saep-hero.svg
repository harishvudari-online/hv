<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Doubao Phone Assistant consumer launch with SAEP app opt-out</title>
  <desc id="desc">Editorial illustration of ByteDance shipping Doubao Phone Assistant on 14 September 2026 with SAEP so third-party apps can refuse screen automation, ahead of the Nubia NaviX Ultra sale on 16 September.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="160" cy="80" r="230" fill="#00C2FF" fill-opacity="0.16"/>
  <circle cx="1060" cy="560" r="250" fill="#FF9B80" fill-opacity="0.12"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Doubao Phone Assistant: apps get a refuse switch</text>
  <text x="118" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Consumer launch 14 Sep 2026  |  SAEP protocol  |  Nubia NaviX Ultra on sale 16 Sep</text>

  <rect x="118" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.65" stroke-width="2"/>
  <text x="148" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Ships today</text>
  <rect x="148" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="166" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Screen Q&amp;A, local photos, messages, notes</text>
  <text x="166" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Voice wake plus fingerprint AI key</text>
  <text x="166" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Operate Phone stays in beta, not cut</text>
  <text x="148" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">First device: ZTE Nubia NaviX Ultra</text>

  <rect x="622" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#FF9B80" stroke-opacity="0.7" stroke-width="2"/>
  <text x="652" y="258" fill="#FF9B80" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">SAEP opt-out</text>
  <rect x="652" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="670" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Apps declare allow or refuse automation</text>
  <text x="670" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">30-day public comment on the rules</text>
  <text x="670" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">MCP APIs sit beside GUI taps</text>
  <text x="652" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Page vs app scope is still unpublished</text>

  <text x="118" y="534" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="18">The assistant can tap. The app being tapped finally has a formal switch.</text>
</svg>
