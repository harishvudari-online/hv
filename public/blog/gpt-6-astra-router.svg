<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="routerTitle routerDesc">
  <title id="routerTitle">How teams should route GPT-6 Astra</title>
  <desc id="routerDesc">A three-lane cost diagram: cheap models, mid-tier models, and Astra for high-stakes computer use.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Do not put Astra on every request</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Measure dollars per completed task. List price is $10 input and $50 output per million tokens.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.4"/>
  <text x="134" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Cheap lane</text>
  <text x="134" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Classify, extract,</text>
  <text x="134" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">route, and summarize</text>
  <text x="134" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">High volume</text>
  <text x="134" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Low irreversible risk</text>
  <text x="134" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Keep this as the default</text>

  <rect x="448" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#74D7FF" stroke-opacity="0.45"/>
  <text x="472" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Mid-tier lane</text>
  <text x="472" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Drafts, reviews,</text>
  <text x="472" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">and bounded tool use</text>
  <text x="472" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Most product traffic</text>
  <text x="472" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Human checkpoint still useful</text>
  <text x="472" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Where margins live</text>

  <rect x="786" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55"/>
  <text x="810" y="256" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Astra lane</text>
  <text x="810" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Long-horizon coding,</text>
  <text x="810" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">computer use, research</text>
  <text x="810" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Fewer retries, higher spend</text>
  <text x="810" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Safety checks can pause work</text>
  <text x="810" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Buy completed jobs, not tokens</text>
</svg>
