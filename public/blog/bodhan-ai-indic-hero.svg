<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bodhan AI Indic language models</title>
  <desc id="desc">Editorial illustration of four Bodhan AI open-weight Indic models under the Bharat EduAI Stack with NVIDIA and AI4Bharat.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="150" cy="90" r="230" fill="#00C2FF" fill-opacity="0.16"/>
  <circle cx="1080" cy="540" r="270" fill="#7CFFB2" fill-opacity="0.12"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Bodhan AI: four open Indic models</text>
  <text x="118" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">IIT Madras  |  AI4Bharat  |  NVIDIA NeMo and Nemotron 3.5 ASR</text>

  <rect x="118" y="206" width="230" height="230" rx="20" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.6" stroke-width="2"/>
  <text x="140" y="248" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Transcribe</text>
  <text x="140" y="282" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">Speech to text</text>
  <text x="140" y="312" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">27 languages</text>
  <text x="140" y="340" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Code-mix and LID</text>
  <text x="140" y="396" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="13">Voice of India WER 11.3</text>

  <rect x="368" y="206" width="230" height="230" rx="20" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.6" stroke-width="2"/>
  <text x="390" y="248" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Speak</text>
  <text x="390" y="282" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">Text to speech</text>
  <text x="390" y="312" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Indic + English</text>
  <text x="390" y="340" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Classroom voice</text>
  <text x="390" y="396" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="13">Tutor replies aloud</text>

  <rect x="618" y="206" width="230" height="230" rx="20" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.55" stroke-width="2"/>
  <text x="640" y="248" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Translate</text>
  <text x="640" y="282" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">Machine translation</text>
  <text x="640" y="312" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">22 scheduled langs</text>
  <text x="640" y="340" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">English pairs</text>
  <text x="640" y="396" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="13">Move textbooks, not just chat</text>

  <rect x="868" y="206" width="230" height="230" rx="20" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.55" stroke-width="2"/>
  <text x="890" y="248" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">OCR</text>
  <text x="890" y="282" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">Print and handwriting</text>
  <text x="890" y="312" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Equations and tables</text>
  <text x="890" y="340" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Worksheets, answers</text>
  <text x="890" y="396" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="13">Vision for the classroom</text>

  <text x="118" y="488" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="18">Open weights plus hosted endpoints. One Bharat EduAI Stack, not 28 state rebuilds.</text>
  <text x="118" y="526" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Education apps stay free for learners, teachers, and partnering state governments.</text>
</svg>
