<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">DeepSeek-Coder-V3 vs Claude 3.7 Sonnet and OpenAI GPT-4o on SWE-bench Verified</title>
  <desc id="cmpDesc">Architectural and benchmark comparison of DeepSeek-Coder-V3 against Claude 3.7 Sonnet and OpenAI GPT-4o as of 1 October 2026, comparing SWE-bench Verified accuracy, model architecture, active parameters, context length, and API cost per million tokens.</desc>
  <rect width="1200" height="630" fill="#0B132B"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#111D4A" stroke="#4CC9F0" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#E0FBFC" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Coding Frontier: Open Weights vs Proprietary Developer APIs</text>
  <text x="110" y="168" fill="#4CC9F0" font-family="Inter, Arial, sans-serif" font-size="18">DeepSeek-Coder-V3 narrows the coding gap with 62.8% on SWE-bench Verified at a fraction of hosted API cost.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#0B132B" stroke="#4CC9F0" stroke-opacity="0.75"/>
  <text x="140" y="258" fill="#4CC9F0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">DeepSeek-Coder-V3</text>
  <text x="140" y="302" fill="#E0FBFC" font-family="Inter, Arial, sans-serif" font-size="16">Open Weights (MIT License)</text>
  <text x="140" y="338" fill="#C5D3E8" font-family="Inter, Arial, sans-serif" font-size="15">SWE-bench Verified: 62.8%</text>
  <text x="140" y="372" fill="#C5D3E8" font-family="Inter, Arial, sans-serif" font-size="15">236B MoE (21B active)</text>
  <text x="140" y="406" fill="#89DCEB" font-family="Inter, Arial, sans-serif" font-size="15">128K context window</text>
  <text x="140" y="440" fill="#89DCEB" font-family="Inter, Arial, sans-serif" font-size="15">$0.14 input / $0.28 output</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#0B132B" stroke="#F72585" stroke-opacity="0.75"/>
  <text x="480" y="258" fill="#F72585" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Claude 3.7 Sonnet</text>
  <text x="480" y="302" fill="#E0FBFC" font-family="Inter, Arial, sans-serif" font-size="16">Proprietary API (Anthropic)</text>
  <text x="480" y="338" fill="#C5D3E8" font-family="Inter, Arial, sans-serif" font-size="15">SWE-bench Verified: 70.3%</text>
  <text x="480" y="372" fill="#C5D3E8" font-family="Inter, Arial, sans-serif" font-size="15">Hybrid reasoning model</text>
  <text x="480" y="406" fill="#F48CBA" font-family="Inter, Arial, sans-serif" font-size="15">200K context window</text>
  <text x="480" y="440" fill="#F48CBA" font-family="Inter, Arial, sans-serif" font-size="15">$3.00 input / $15.00 output</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#0B132B" stroke="#7209B7" stroke-opacity="0.65"/>
  <text x="820" y="258" fill="#B5179E" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">GPT-4o (OpenAI)</text>
  <text x="820" y="302" fill="#E0FBFC" font-family="Inter, Arial, sans-serif" font-size="16">Proprietary API (OpenAI)</text>
  <text x="820" y="338" fill="#C5D3E8" font-family="Inter, Arial, sans-serif" font-size="15">SWE-bench Verified: 38.8%</text>
  <text x="820" y="372" fill="#C5D3E8" font-family="Inter, Arial, sans-serif" font-size="15">Omni multimodal model</text>
  <text x="820" y="406" fill="#C77DFF" font-family="Inter, Arial, sans-serif" font-size="15">128K context window</text>
  <text x="820" y="440" fill="#C77DFF" font-family="Inter, Arial, sans-serif" font-size="15">$2.50 input / $10.00 output</text>

  <text x="110" y="532" fill="#E0FBFC" font-family="Inter, Arial, sans-serif" font-size="16">Score the coding economics trade-off. DeepSeek offers near-frontier agentic software engineering capabilities at 1/20th the token cost of proprietary APIs.</text>
</svg>
