<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">EU AI Act GPAI Compliance Tiers and Enforcement Architecture</title>
  <desc id="cmpDesc">Architectural comparison of standard GPAI compliance requirements versus Systemic Risk Tier obligations exceeding 10^25 FLOPs under the European AI Office enforcement regime as of 29 September 2026.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">EU AI Act GPAI Framework: Standard vs Systemic Risk Tier</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">The European AI Office initiates formal oversight based on training compute metrics and downstream deployment risk.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Standard GPAI</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Under 10^25 FLOPs</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Technical documentation</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Copyright policy compliance</text>
  <text x="140" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Training summary disclosures</text>
  <text x="140" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Open-weights exemptions apply</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#FFCC00" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#FFCC00" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Systemic Risk Tier</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Over 10^25 FLOPs</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Continuous model evaluations</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Independent red-team audits</text>
  <text x="480" y="406" fill="#FFE880" font-family="Inter, Arial, sans-serif" font-size="15">Incident reporting protocol</text>
  <text x="480" y="440" fill="#FFE880" font-family="Inter, Arial, sans-serif" font-size="15">Mandatory cybersecurity stack</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.55"/>
  <text x="820" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Sanctions &amp; Process</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Formal Information Request</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">30-day response window</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Fines up to 35M EUR or 7%</text>
  <text x="820" y="406" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Scientific panel review</text>
  <text x="820" y="440" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Remediation before penalty</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the regulatory architecture. Brussels moves from legislative debate into structured technical audits for frontier AI systems operating in the European single market.</text>
</svg>
