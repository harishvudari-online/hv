<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AWS Trainium3 UltraServer Preview Briefing</title>
  <desc id="desc">Editorial illustration of AWS Trainium3 UltraServer as of 25 September 2026: Annapurna Labs 3nm accelerator with 64 Trainium3 chips, 96 PFLOPs FP8 compute, 1.5 TB HBM3e memory, and 24.8 TB per second bandwidth.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="150" cy="80" r="230" fill="#FF9900" fill-opacity="0.14"/>
  <circle cx="1080" cy="560" r="250" fill="#00C2FF" fill-opacity="0.12"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#FF9900" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">AWS Trainium3 UltraServer: 64-Chip Scale, 3nm Node, Not Blackwell</text>
  <text x="118" y="168" fill="#FFB84D" font-family="Inter, Arial, sans-serif" font-size="18">AWS Annapurna Labs  |  25 Sep 2026  |  Chips Category  |  Preview Access Q4 2026  |  Not NVIDIA NVL72</text>

  <rect x="118" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#FF9900" stroke-opacity="0.65" stroke-width="2"/>
  <text x="142" y="252" fill="#FF9900" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Compute &amp; Silicon</text>
  <text x="142" y="298" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">64 Trainium3 chips per rack</text>
  <text x="142" y="328" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">TSMC 3nm foundry node</text>
  <text x="142" y="358" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">96 PFLOPs FP8 compute</text>
  <text x="142" y="412" fill="#FFD699" font-family="Inter, Arial, sans-serif" font-size="14">4x compute density vs Trainium2</text>
  <text x="142" y="436" fill="#FFD699" font-family="Inter, Arial, sans-serif" font-size="14">Direct liquid cooling design</text>

  <rect x="448" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.65" stroke-width="2"/>
  <text x="472" y="252" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Memory &amp; Fabric</text>
  <text x="472" y="298" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">1.5 TB total HBM3e pool</text>
  <text x="472" y="328" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">24.8 TB/s memory bandwidth</text>
  <text x="472" y="358" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">NeuronLink v3 interconnect</text>
  <text x="472" y="412" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="14">EFA non-blocking networking</text>
  <text x="472" y="436" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="14">Optimized for 1T+ parameter MoE</text>

  <rect x="778" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="802" y="252" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">What It Is Not</text>
  <text x="802" y="298" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">Not NVIDIA GB200 NVL72</text>
  <text x="802" y="328" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Not general availability yet</text>
  <text x="802" y="358" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Not standalone merchant silicon</text>
  <text x="802" y="412" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Not standard PCIe form factor</text>
  <text x="802" y="436" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">AWS cloud only infrastructure</text>

  <text x="118" y="512" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="18">Score a cloud silicon architecture milestone. Trainium3 scales AWS custom AI capacity while NVIDIA Blackwell retains the raw merchant crown.</text>
  <text x="118" y="542" fill="#FFB84D" font-family="Inter, Arial, sans-serif" font-size="16">Preview access begins in late Q4 2026 across select US East and West regions.</text>
</svg>
