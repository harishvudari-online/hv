<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Iris search agent context management</title>
  <desc id="desc">Diagram of a single ReAct search loop with discard-all reset and optional retry, showing BrowseComp scores with and without context management.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="180" cy="80" r="220" fill="#00C2FF" fill-opacity="0.14"/>
  <circle cx="1040" cy="560" r="240" fill="#7CFFB2" fill-opacity="0.10"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="124" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">One ReAct loop. Two ways to buy more search.</text>
  <text x="118" y="162" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="17">Tool set is search and scrape. No sub-agents. No test-time verifier.</text>

  <rect x="118" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="138" y="236" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Reason</text>
  <text x="138" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Decide the next query</text>

  <rect x="348" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="368" y="236" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Search</text>
  <text x="368" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Live web, then scrape</text>

  <rect x="578" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="598" y="236" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Read</text>
  <text x="598" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Summarized observations</text>

  <rect x="808" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.55" stroke-width="2"/>
  <text x="828" y="236" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Stop</text>
  <text x="828" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Boxed final answer</text>

  <rect x="118" y="328" width="430" height="92" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55" stroke-width="2"/>
  <text x="140" y="368" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">discard-all</text>
  <text x="140" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Reset to the question once the prompt crosses a threshold</text>

  <rect x="568" y="328" width="450" height="92" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.5" stroke-width="2"/>
  <text x="590" y="368" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">retry</text>
  <text x="590" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Restart a failed episode, keep a short list of ruled-out paths</text>

  <rect x="118" y="448" width="430" height="78" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.5" stroke-width="2"/>
  <text x="140" y="480" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Iris-pro without CM</text>
  <text x="140" y="506" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">BrowseComp 72.6  |  HLE 50.8</text>

  <rect x="568" y="448" width="450" height="78" rx="16" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.5" stroke-width="2"/>
  <text x="590" y="480" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Iris-pro with discard-all</text>
  <text x="590" y="506" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">BrowseComp 88.6 (+16.0)  |  HLE 56.4</text>
</svg>
