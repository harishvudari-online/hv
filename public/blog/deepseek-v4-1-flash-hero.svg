<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4.1 Flash versus V4 Pro</title>
  <desc id="desc">Editorial illustration of DeepSeek V4.1 Flash as a cheap open-weight agent model beside V4 Pro, which still ships after the planned 14 September cutover.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="160" cy="80" r="230" fill="#00C2FF" fill-opacity="0.16"/>
  <circle cx="1060" cy="560" r="250" fill="#7CFFB2" fill-opacity="0.12"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">DeepSeek V4.1 Flash: agent workhorse, Pro stays</text>
  <text x="118" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">GA 10 Sep 2026  |  deepseek-flash  |  MIT weights  |  Pro cutover walked back</text>

  <rect x="118" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.65" stroke-width="2"/>
  <text x="148" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">deepseek-flash</text>
  <rect x="148" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="166" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">552B MoE, 8B prefill / 16B decode</text>
  <text x="166" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">$0.15 in / $0.60 out off-peak (1M tokens)</text>
  <text x="166" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">DeepSWE 74.2, Terminal-Bench 2.1 90.6</text>
  <text x="148" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">1M context, native vision, 2,500 concurrency</text>

  <rect x="622" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.6" stroke-width="2"/>
  <text x="652" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">deepseek-v4-pro</text>
  <rect x="652" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="670" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">V4-Pro-0813 still billed as Pro</text>
  <text x="670" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">$0.66 in / $1.98 out off-peak (1M tokens)</text>
  <text x="670" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">GPQA 92.4 and text HLE still lead Flash</text>
  <text x="652" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Kept after 14 Sep after users asked to keep it</text>

  <text x="118" y="534" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="18">Old Flash IDs already route here. Pro was scheduled to follow. Official docs now say it stays.</text>
</svg>
