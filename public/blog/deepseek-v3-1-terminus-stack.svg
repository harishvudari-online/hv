<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">DeepSeek-V3.1-Terminus MoE Architecture compared with Claude Opus 5.5 and GPT-6 Sol</title>
  <desc id="cmpDesc">Architectural and benchmark comparison of DeepSeek-V3.1-Terminus, Claude Opus 5.5, and GPT-6 Sol as of 2 October 2026, comparing total parameters, active parameters per token, pricing, and open weights licensing.</desc>
