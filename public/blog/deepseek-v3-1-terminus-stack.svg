  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the open weights revolution. DeepSeek-V3.1-Terminus provides downloadable frontier intelligence under MIT license, disrupting proprietary cloud monopoly pricing.</text>
