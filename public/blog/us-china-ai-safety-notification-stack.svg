<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">US-China AI safety notification versus Pace the Frontier and the AI standards body</title>
  <desc id="cmpDesc">Diagram comparing the proposed US-China AI safety notification for national-security incidents as of 21 September 2026, Pace the Frontier as a lab slowdown pledge, and the unsigned AI standards body talks among Anthropic, OpenAI, and Google.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Three AI-governance cards. Only one is a government channel.</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Alerts were proposed Sunday. A lab pledge is not a treaty. A referee is still unsigned.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">This briefing</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">US-China notification</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Treasury and USTR</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">NS-level AI incidents</text>
  <text x="140" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Xinhua: AI dialogue only</text>
  <text x="140" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Export controls stay out</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Pace the Frontier</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Lab slowdown essay</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Amodei, Altman, Musk</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Embedded evaluators</text>
  <text x="480" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Also a Sherman Act exhibit</text>
  <text x="480" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Not a Beijing hotline</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="820" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Standards body</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Industry referee talks</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Anthropic, OpenAI, Google</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Hassabis wants FINRA tests</text>
  <text x="820" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">No charter, board, date</text>
  <text x="820" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Not a US-China channel</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the government alert ask. Do not collapse a hotline, a lab pledge, and an unsigned referee into one treaty.</text>
</svg>
