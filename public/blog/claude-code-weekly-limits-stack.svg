<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code weekly versus five-hour usage layers</title>
  <desc id="desc">Diagram of Claude Code usage layers: unchanged five-hour session limits beside a weekly cap that moved from a 50 percent promotional boost to a 25 percent permanent increase over the pre-May baseline on 14 September 2026.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="180" cy="80" r="220" fill="#00C2FF" fill-opacity="0.14"/>
  <circle cx="1040" cy="560" r="240" fill="#7CFFB2" fill-opacity="0.10"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="124" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Two meters. Only one moved today.</text>
  <text x="118" y="162" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="17">Weekly Claude Code limits changed. Five-hour session limits did not.</text>

  <rect x="118" y="200" width="300" height="100" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="138" y="240" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">May baseline</text>
  <text x="138" y="270" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Indexed weekly bar: 100</text>

  <rect x="438" y="200" width="300" height="100" rx="16" fill="#08203A" stroke="#FF9B80" stroke-opacity="0.65" stroke-width="2"/>
  <text x="458" y="240" fill="#FF9B80" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">13 May to 13 Sep</text>
  <text x="458" y="270" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Temporary 50% boost: 150</text>

  <rect x="758" y="200" width="300" height="100" rx="16" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.65" stroke-width="2"/>
  <text x="778" y="240" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">From 14 Sep</text>
  <text x="778" y="270" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Permanent 25%: 125</text>

  <rect x="118" y="328" width="900" height="92" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55" stroke-width="2"/>
  <text x="148" y="372" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Eligible: Pro, Max, Team, seat-based Enterprise</text>
  <text x="148" y="400" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Free and consumption-based Enterprise were never on the 50% weekly boost.</text>

  <rect x="118" y="448" width="430" height="78" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.5" stroke-width="2"/>
  <text x="140" y="480" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Unchanged</text>
  <text x="140" y="506" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Five-hour window  |  list prices  |  API rates</text>

  <rect x="568" y="448" width="450" height="78" rx="16" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.5" stroke-width="2"/>
  <text x="590" y="480" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Check today</text>
  <text x="590" y="506" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Run /usage  |  overflow is usage credits</text>
</svg>
