<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agentforce long-horizon runtime stack</title>
  <desc id="desc">Diagram of Salesforce Agentforce job-ready agents sitting on Customer 360, with Hunter on the long-horizon runtime of memory, durable execution, and dynamic steering, plus AI Skills, Multi-Agent Orchestration, and Agent Optimizer dates.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="180" cy="80" r="220" fill="#00C2FF" fill-opacity="0.14"/>
  <circle cx="1040" cy="560" r="240" fill="#7CFFB2" fill-opacity="0.10"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="124" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">A job on CRM. A plan that outlives the chat.</text>
  <text x="118" y="162" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="17">Hunter is first on the long-horizon runtime. The other six are GA without it.</text>

  <rect x="118" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="138" y="236" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Memory</text>
  <text x="138" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Context across sessions</text>

  <rect x="348" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="368" y="236" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Durable exec</text>
  <text x="368" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Plans run for days</text>

  <rect x="578" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="598" y="236" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Steering</text>
  <text x="598" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Seller feedback bends it</text>

  <rect x="808" y="200" width="210" height="88" rx="16" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.55" stroke-width="2"/>
  <text x="828" y="236" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Agent Script</text>
  <text x="828" y="262" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Deterministic if/else</text>

  <rect x="118" y="328" width="900" height="92" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55" stroke-width="2"/>
  <text x="148" y="372" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Customer 360 plus named jobs (Casey, Paige, Carter, Marshall, Piper, Fin, Hunter)</text>
  <text x="148" y="400" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Hunter is the only agent Salesforce put on the weeks-long runtime at launch.</text>

  <rect x="118" y="448" width="430" height="78" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.5" stroke-width="2"/>
  <text x="140" y="480" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">GA now</text>
  <text x="140" y="506" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Six agents  |  Multi-Agent Orchestration</text>

  <rect x="568" y="448" width="450" height="78" rx="16" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.5" stroke-width="2"/>
  <text x="590" y="480" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Calendar</text>
  <text x="590" y="506" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">AI Skills and Optimizer Oct  |  Hunter Nov</text>
</svg>
