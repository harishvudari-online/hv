<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">AWS Trainium3 UltraServer versus Trainium2 and Nvidia GB200 NVL72</title>
  <desc id="cmpDesc">Architectural comparison of AWS Trainium3 UltraServer, AWS Trainium2 Trn2, and Nvidia GB200 NVL72 as of 24 September 2026, comparing process nodes, chip topology, interconnects, and cooling.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#FF9900" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Custom silicon scaling. 3nm Trainium3 targets frontier clusters.</text>
  <text x="110" y="168" fill="#FFB84D" font-family="Inter, Arial, sans-serif" font-size="18">Trn3 is 3nm with 64-chip liquid UltraServer. Trn2 is 16-chip air/hybrid. GB200 NVL72 is Nvidia 72-GPU rack.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Trainium3 UltraServer</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">3nm Annapurna design</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">64-chip dense rack unit</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">NeuronLink-v3 fabric</text>
  <text x="140" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Direct liquid cooling</text>
  <text x="140" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">4x Trainium2 FP8 FLOPS</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#FF9900" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#FFB84D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Trainium2 (Trn2)</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Previous generation</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">16-chip server topology</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">NeuronLink-v2 interconnect</text>
  <text x="480" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Air and hybrid cooling</text>
  <text x="480" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">General commercial fleet</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="820" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Nvidia GB200 NVL72</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Commercial GPU rack</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">72 Blackwell GPUs in rack</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">NVLink 5 domain switch</text>
  <text x="820" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Liquid-cooled data center</text>
  <text x="820" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Multi-cloud availability</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the architecture split. Trainium3 scales cloud custom silicon while Anthropic and Amazon scale proprietary UltraClusters.</text>
</svg>
