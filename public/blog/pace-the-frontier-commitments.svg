<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">Who committed to pacing the AI frontier and who did not</title>
  <desc id="cmpDesc">Diagram of Anthropic and OpenAI evaluator pledges, DeepMind standards support, and the White House rejection of a slowdown.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Commitments versus a pause</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Score the desks, not the slogans. A halt is not on the table.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.65"/>
  <text x="140" y="258" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Pledged</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Anthropic: evaluators now</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">OpenAI: we will do the same</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Publish without editorial veto</text>
  <text x="140" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">METR named as an example</text>
  <text x="140" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Desks, badges, company laptops</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="480" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Direction</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Hassabis: standards body</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Nadella: keep humans in control</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Musk: Amodei is right</text>
  <text x="480" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">July DeepMind FINRA-style idea</text>
  <text x="480" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">No shared compute cap yet</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#E85D4C" stroke-opacity="0.55"/>
  <text x="820" y="258" fill="#E85D4C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Rejected</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Trump: no slowdown needed</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">China lead is the veto risk</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Pacing is not stopping</text>
  <text x="820" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">US law will lag voluntary desks</text>
  <text x="820" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Watch named teams, not X posts</text>
</svg>
