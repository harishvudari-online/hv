<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bharat EduAI Stack layers</title>
  <desc id="desc">Diagram of NVIDIA training stack, four Bodhan Indic models, hosted and open-weight access, and classroom bots.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="180" cy="80" r="220" fill="#00C2FF" fill-opacity="0.14"/>
  <circle cx="1040" cy="560" r="240" fill="#7CFFB2" fill-opacity="0.10"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="124" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Bharat EduAI Stack: a public language layer</text>
  <text x="118" y="160" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16">Train once. Serve as digital public goods. Keep teachers in the loop.</text>

  <rect x="118" y="190" width="964" height="78" rx="16" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="140" y="222" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Train and serve</text>
  <text x="140" y="248" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">NVIDIA NeMo, Nemotron 3.5 ASR, TensorRT-LLM, vLLM microservices</text>

  <rect x="118" y="286" width="964" height="78" rx="16" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55" stroke-width="2"/>
  <text x="140" y="318" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Four foundational models</text>
  <text x="140" y="344" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Indic-Transcribe  |  Indic-Speak  |  Indic-Translate  |  Indic-OCR</text>

  <rect x="118" y="382" width="460" height="78" rx="16" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.5" stroke-width="2"/>
  <text x="140" y="414" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Access</text>
  <text x="140" y="440" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Open weights and hosted sovereign endpoints</text>

  <rect x="598" y="382" width="484" height="78" rx="16" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.5" stroke-width="2"/>
  <text x="620" y="414" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Classroom products</text>
  <text x="620" y="440" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="14">Student Tutor Bot  |  Teacher Assistant Bot</text>

  <text x="118" y="504" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Tutor Bot: Classes 6-12, NCERT and SCERT, voice or text in 22 languages.</text>
  <text x="118" y="532" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Teacher Bot drafts plans and quizzes. Humans keep the gradebook.</text>
</svg>
