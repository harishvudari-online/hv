<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metersTitle metersDesc">
  <title id="metersTitle">GPT-Live-1 billing meters for voice, backend tokens, and tools</title>
  <desc id="metersDesc">A three-lane cost diagram for the GPT-Live-1 voice minute, backend model tokens, and tool calls.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">GPT-Live-1 is a voice meter, not a token table.</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Pay $0.05 per occupied minute, then pay the backend model and tools on top.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.4"/>
  <text x="134" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Voice session</text>
  <text x="134" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">$0.05 per minute</text>
  <text x="134" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Billed per second</text>
  <text x="134" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">30 seconds = $0.025</text>
  <text x="134" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Idle open sessions still bill</text>
  <text x="134" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">No free-tier sessions</text>

  <rect x="448" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#74D7FF" stroke-opacity="0.45"/>
  <text x="472" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Backend model</text>
  <text x="472" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Luna for volume</text>
  <text x="472" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Astra for hard cases</text>
  <text x="472" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Standard token rates apply</text>
  <text x="472" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Interruptions do not cancel work</text>
  <text x="472" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Route by task, not by ego</text>

  <rect x="786" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55"/>
  <text x="810" y="256" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Tools + harness</text>
  <text x="810" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Search, functions, MCP</text>
  <text x="810" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Agents API optional</text>
  <text x="810" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Billed per tool and token</text>
  <text x="810" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Measure dollars per resolved call</text>
  <text x="810" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Hang up the voice meter</text>
</svg>
