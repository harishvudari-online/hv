<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">SoftBank Group Capital Structure: Bridge Prepayment vs Unsecured Syndicates vs Margin Facility</title>
  <desc id="cmpDesc">Architectural comparison of SoftBank Group capital structure transitions in autumn 2026, comparing the prepaid $25.9B March bridge, the $11.87B corporate loan, and the $10B collateralized margin facility backed by OpenAI equity.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">SoftBank Capital Structure Evolution: Financing the $64.6B OpenAI Stake</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Transition from temporary bridge debt to long-term syndicated facilities and asset-backed margin leverage as of 5 October 2026.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#FF9B80" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#FF9B80" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Prepaid Bridge Line</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">$40B Unsecured Facility</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Signed 27 March 2026</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">$30B drawn across tranches</text>
  <text x="140" y="406" fill="#FFB088" font-family="Inter, Arial, sans-serif" font-size="15">$25.9B prepaid on 15 Sep</text>
  <text x="140" y="440" fill="#FFB088" font-family="Inter, Arial, sans-serif" font-size="15">Maturity risk fully cleared</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Syndicated Loan</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">$11.87B Corporate Refinance</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Upsized from $10B target</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">20 participating global banks</text>
  <text x="480" y="406" fill="#FFDF9E" font-family="Inter, Arial, sans-serif" font-size="15">Corporate credit recourse</text>
  <text x="480" y="440" fill="#FFDF9E" font-family="Inter, Arial, sans-serif" font-size="15">Supports working capital</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.7"/>
  <text x="820" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">OpenAI Margin Line</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">$10.0B Definitive Facility</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Secured by 13% OpenAI stake</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">SOFR + 265 bps floating</text>
  <text x="820" y="406" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Non-recourse SPV ring-fence</text>
  <text x="820" y="440" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Funds final 1 Oct tranche</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the liquidity architecture. SoftBank completes its $64.6B OpenAI funding commitment without equity dilution by collateralizing private tech assets.</text>
</svg>