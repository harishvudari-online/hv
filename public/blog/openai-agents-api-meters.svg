<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metersTitle metersDesc">
  <title id="metersTitle">Three billing meters on the OpenAI Agents API</title>
  <desc id="metersDesc">A three-lane cost diagram for model tokens, tool calls, and hosted sandbox containers.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">There is no Agents API SKU. There are three meters.</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">OpenAI bills tokens, tools, and hosted containers. Idle sandboxes still cost money.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.4"/>
  <text x="134" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Model tokens</text>
  <text x="134" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Pay the selected</text>
  <text x="134" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">model input and output</text>
  <text x="134" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Astra is a specialist SKU</text>
  <text x="134" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Cache hits change the bill</text>
  <text x="134" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Do not default to Astra</text>

  <rect x="448" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#74D7FF" stroke-opacity="0.45"/>
  <text x="472" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Tools</text>
  <text x="472" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Web search, MCP,</text>
  <text x="472" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">and built-in calls</text>
  <text x="472" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Tool search saves tokens</text>
  <text x="472" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Keep keys out of the box</text>
  <text x="472" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Measure calls per task</text>

  <rect x="786" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55"/>
  <text x="810" y="256" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Containers</text>
  <text x="810" y="296" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">1 GB $0.03 / 20 min</text>
  <text x="810" y="324" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">64 GB $1.92 / 20 min</text>
  <text x="810" y="368" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Billed by the minute</text>
  <text x="810" y="396" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="16">Five-minute minimum</text>
  <text x="810" y="444" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Delete idle sessions</text>
</svg>
