<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">AWS Trainium3 UltraServer versus NVIDIA GB200 NVL72 and Trainium2</title>
  <desc id="cmpDesc">Diagram comparing AWS Trainium3 UltraServer with NVIDIA GB200 NVL72 and prior generation AWS Trainium2 as of 25 September 2026, displaying process node, compute density, memory bandwidth, and deployment model.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#FF9900" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Cloud AI Rack Architectures: Trainium3 UltraServer vs NVL72</text>
  <text x="110" y="168" fill="#FFB84D" font-family="Inter, Arial, sans-serif" font-size="18">Annapurna Labs 3nm rack cuts training costs up to 45% compared to commercial GPU clusters.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#FF9900" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#FF9900" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Trainium3 UltraServer</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">AWS Annapurna Labs</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">64 Trainium3 chips</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">96 PFLOPs FP8 compute</text>
  <text x="140" y="406" fill="#FFD699" font-family="Inter, Arial, sans-serif" font-size="15">1.5 TB HBM3e (24.8 TB/s)</text>
  <text x="140" y="440" fill="#FFD699" font-family="Inter, Arial, sans-serif" font-size="15">NeuronLink v3 interconnect</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">NVIDIA GB200 NVL72</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Merchant GPU Flagship</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">72 Blackwell GPUs + 36 CPUs</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">144 PFLOPs FP8 compute</text>
  <text x="480" y="406" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">13.5 TB fast unified memory</text>
  <text x="480" y="440" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">NVLink 5 domain (130 TB/s)</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="820" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">AWS Trainium2 Server</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Prior Generation Node</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">16 Trainium2 chips (trn2.48xl)</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">20.8 PFLOPs FP8 compute</text>
  <text x="820" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">512 GB HBM (3.2 TB/s)</text>
  <text x="820" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">NeuronLink v2 interconnect</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the custom silicon economics. Trainium3 closes the architectural gap with commercial GPUs for high-volume foundation model training.</text>
</svg>
