<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmpTitle cmpDesc">
  <title id="cmpTitle">AgentOps Engineering vs Legacy Prompt Engineering</title>
  <desc id="cmpDesc">Architectural comparison of legacy prompt engineering, manual agent testing, and enterprise AgentOps engineering as of 4 October 2026, comparing skill requirements, compensation bands, tooling stacks, and production failure rates.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">AI Role Evolution: From Fragile Prompting to Robust Agent Reliability</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Enterprise compensation rewards distributed systems reliability, automated evaluation, and runtime governance over manual prompt craft.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#FF9B80" stroke-opacity="0.7"/>
  <text x="140" y="258" fill="#FF9B80" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Prompt Engineering</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Legacy 2023 to 2024</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">$120K to $160K compensation</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Manual wording modifications</text>
  <text x="140" y="406" fill="#FFB088" font-family="Inter, Arial, sans-serif" font-size="15">Subjective spot-check scoring</text>
  <text x="140" y="440" fill="#FFB088" font-family="Inter, Arial, sans-serif" font-size="15">High production drift rate</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.7"/>
  <text x="480" y="258" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">AgentOps Engineering</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Production Standard 2026</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">$240K to $280K base pay</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">OpenTelemetry &amp; session traces</text>
  <text x="480" y="406" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Synthetic adversarial stress</text>
  <text x="480" y="440" fill="#A7FFD0" font-family="Inter, Arial, sans-serif" font-size="15">Automated CI regression gates</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="820" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Enterprise Value</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Business Outcome</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Fleet reliability &amp; compliance</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Deterministic task completion</text>
  <text x="820" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Token and KV cache governance</text>
  <text x="820" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Multi-agent safe handoffs</text>

  <text x="110" y="532" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the engineering transformation. Managing production agent clusters requires software reliability engineering, telemetry analysis, and rigorous regression testing.</text>
</svg>
