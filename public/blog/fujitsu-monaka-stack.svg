<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">Fujitsu MONAKA sovereign AI stack</title>
  <desc id="stackDesc">Diagram of silicon, servers, and software in Fujitsu's sovereign AI inference pitch.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Three layers, one audit story</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Fujitsu is selling silicon, a Japan-built server, and a software wrap. Buyers will score all three.</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#E85D4C" stroke-opacity="0.65"/>
  <text x="140" y="258" fill="#E85D4C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">CPU</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">FUJITSU-MONAKA</text>
  <text x="140" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">2nm core, 5nm cache/I/O</text>
  <text x="140" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Matrix ops plus SVE2</text>
  <text x="140" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Wafers: TSMC</text>
  <text x="140" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Rapidus is a later option</text>

  <rect x="450" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="480" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Server</text>
  <text x="480" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">MONAKA Server</text>
  <text x="480" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">1U / 2U, CDI/CXL pooling</text>
  <text x="480" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Air cool to 40 C</text>
  <text x="480" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Built in Ishikawa</text>
  <text x="480" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Cooling power down to 20%</text>

  <rect x="790" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.5"/>
  <text x="820" y="258" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Software</text>
  <text x="820" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Kozuchi + Takane</text>
  <text x="820" y="338" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Industry models on top</text>
  <text x="820" y="372" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Traceability for auditors</text>
  <text x="820" y="406" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Japan and Europe first</text>
  <text x="820" y="440" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="15">Defense is in the pitch</text>
</svg>
