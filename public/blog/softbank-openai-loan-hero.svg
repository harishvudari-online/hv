<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SoftBank OpenAI loan $11.9 billion</title>
  <desc id="desc">Editorial illustration of SoftBank Group sealing an $11.87 billion two-year OpenAI loan reported on 14 September 2026, with a $25.9 billion bridge prepayment due 15 September and a $10 billion OpenAI tranche still due 1 October.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="160" cy="80" r="230" fill="#00C2FF" fill-opacity="0.16"/>
  <circle cx="1060" cy="560" r="250" fill="#F4C15D" fill-opacity="0.12"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">SoftBank OpenAI loan: $11.9B, still a $65B bet</text>
  <text x="118" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Bloomberg 14 Sep 2026  |  SoftBank declined comment  |  $10B still due 1 Oct</text>

  <rect x="118" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#F4C15D" stroke-opacity="0.65" stroke-width="2"/>
  <text x="142" y="252" fill="#F4C15D" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">New facility</text>
  <rect x="142" y="272" width="252" height="22" rx="6" fill="#12355A"/>
  <rect x="142" y="306" width="198" height="22" rx="6" fill="#12355A"/>
  <rect x="142" y="340" width="230" height="22" rx="6" fill="#12355A"/>
  <text x="142" y="392" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">$11.87B, two years, ~20 banks</text>
  <text x="142" y="428" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Upsized from a $10B target</text>

  <rect x="448" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55" stroke-width="2"/>
  <text x="472" y="252" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Bridge prepay</text>
  <rect x="472" y="272" width="252" height="128" rx="10" fill="#06182E"/>
  <text x="488" y="304" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="14">$40B facility, $30B drawn</text>
  <text x="488" y="328" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="14">$25.9B due 15 Sep 2026</text>
  <text x="488" y="352" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="14">Unsecured, was due Mar 2027</text>
  <text x="472" y="428" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">SoftBank filed this on 9 Sep</text>

  <rect x="778" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.5" stroke-width="2"/>
  <text x="802" y="252" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">OpenAI cheque</text>
  <rect x="802" y="272" width="252" height="18" rx="5" fill="#12355A"/>
  <rect x="802" y="300" width="210" height="18" rx="5" fill="#12355A"/>
  <rect x="802" y="328" width="236" height="18" rx="5" fill="#12355A"/>
  <rect x="802" y="356" width="168" height="18" rx="5" fill="#12355A"/>
  <text x="802" y="402" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="15">Third $10B tranche, 1 Oct</text>
  <text x="802" y="428" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="14">Cumulative $64.6B  |  ~13% stake</text>

  <text x="118" y="512" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="18">Banks oversubscribed a $10 billion target. SoftBank still has a $10 billion cheque due 1 October.</text>
  <text x="118" y="542" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Score the 15 Sep repayment and the 1 Oct close, not a declined-comment loan leak.</text>
</svg>
