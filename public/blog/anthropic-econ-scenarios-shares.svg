<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sharesTitle sharesDesc">
  <title id="sharesTitle">Labor versus capital share in Anthropic AI job scenarios</title>
  <desc id="sharesDesc">Diagram of US labor and capital income shares in Anthropic modest, substantial, and extreme 2030 scenarios.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">The pie grows. Labor's slice can still shrink.</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Labor share of US income in 2030, Anthropic Table 3 (from 60% today).</text>

  <rect x="110" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.4"/>
  <text x="134" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Modest</text>
  <text x="134" y="300" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Labor 59.4%</text>
  <text x="134" y="328" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Capital 40.6%</text>
  <rect x="134" y="360" width="252" height="18" rx="6" fill="#12355A"/>
  <rect x="134" y="360" width="150" height="18" rx="6" fill="#2DAEDC"/>
  <text x="134" y="414" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Almost today's split</text>
  <text x="134" y="442" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="15">Unemployment 3.9%</text>

  <rect x="448" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#74D7FF" stroke-opacity="0.45"/>
  <text x="472" y="256" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Substantial</text>
  <text x="472" y="300" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Labor 56.1%</text>
  <text x="472" y="328" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Capital 43.9%</text>
  <rect x="472" y="360" width="252" height="18" rx="6" fill="#12355A"/>
  <rect x="472" y="360" width="141" height="18" rx="6" fill="#74D7FF"/>
  <text x="472" y="414" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Cognitive pay slightly down</text>
  <text x="472" y="442" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="15">Unemployment 4.6%</text>

  <rect x="786" y="210" width="300" height="280" rx="18" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.55"/>
  <text x="810" y="256" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Extreme</text>
  <text x="810" y="300" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Labor 45.2%</text>
  <text x="810" y="328" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="17">Capital 54.8%</text>
  <rect x="810" y="360" width="252" height="18" rx="6" fill="#12355A"/>
  <rect x="810" y="360" width="114" height="18" rx="6" fill="#1BE7FF"/>
  <text x="810" y="414" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Capital income +81%</text>
  <text x="810" y="442" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="15">Unemployment 11.9%</text>
</svg>
