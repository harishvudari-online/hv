<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="costTitle costDesc">
  <title id="costTitle">Where Fable 5.1 actually gets cheaper</title>
  <desc id="costDesc">Diagram of cache-read savings for typical versus highly agentic workloads.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>
  <text x="110" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">The bill moved on cache hits, not list price</text>
  <text x="110" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Input and output stay $10 and $50 per million tokens. Cache reads fell to $0.25.</text>

  <rect x="110" y="210" width="460" height="280" rx="18" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.55"/>
  <text x="140" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Typical workload</text>
  <text x="140" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="18">Enterprise chat, Claude Code, API mix</text>
  <text x="140" y="352" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">~25%</text>
  <text x="140" y="398" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="18">estimated cheaper than Fable 5</text>
  <text x="140" y="444" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="16">Enough to move some Opus default traffic</text>

  <rect x="630" y="210" width="460" height="280" rx="18" fill="#08203A" stroke="#E8A87C" stroke-opacity="0.65"/>
  <text x="660" y="258" fill="#E8A87C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Highly agentic workload</text>
  <text x="660" y="302" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="18">Long tools, fat prefixes, many turns</text>
  <text x="660" y="352" fill="#E8A87C" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">~45%</text>
  <text x="660" y="398" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="18">estimated cheaper when cache dominates</text>
  <text x="660" y="444" fill="#9BD6EC" font-family="Inter, Arial, sans-serif" font-size="16">Measure dollars per finished task, not tokens</text>
</svg>
