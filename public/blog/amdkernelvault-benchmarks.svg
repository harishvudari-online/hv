<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AMDKernelVault benchmark scores for Qwen3-8B against GPT-5 and Claude Sonnet 4</title>
  <desc id="desc">Diagram of AMDKernelVault results: Qwen3-8B leads PyTorch-to-HIP correctness at 34.0 percent, TritonBench-G Corr@3 at 33.2 percent, and ROCmBench Corr@3 at 41.94 percent, while Claude Sonnet 4 still leads ROCmBench compile and speed.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="150" cy="90" r="230" fill="#00C2FF" fill-opacity="0.16"/>
  <circle cx="1080" cy="540" r="270" fill="#1BE7FF" fill-opacity="0.14"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Same budget. Three scores. One caveat.</text>
  <text x="118" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Qwen3-8B trained on AMDKernelVault versus frontier APIs under identical agent loops</text>

  <rect x="118" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#7CFFB2" stroke-opacity="0.65" stroke-width="2"/>
  <text x="142" y="252" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">PyTorch to HIP</text>
  <text x="142" y="292" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">200 KernelBench L1/L2 tasks</text>
  <text x="142" y="328" fill="#7CFFB2" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">34.0%</text>
  <text x="142" y="368" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Qwen3-8B Pass@1 correctness</text>
  <text x="142" y="400" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">GPT-5: 24.0% correct, 75.5% compile</text>
  <text x="142" y="428" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Base 8B started at 14.5%</text>

  <rect x="448" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#1BE7FF" stroke-opacity="0.5" stroke-width="2"/>
  <text x="472" y="252" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">TritonBench-G</text>
  <text x="472" y="292" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">184 kernels, 3-iteration GEAK</text>
  <text x="472" y="328" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">33.2%</text>
  <text x="472" y="368" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Corr@3 on MI355X inference</text>
  <text x="472" y="400" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">GPT-5: 15.2%  |  Sonnet 4: 29.8%</text>
  <text x="472" y="428" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">D5 kernels still unsolved by all</text>

  <rect x="778" y="210" width="300" height="250" rx="20" fill="#08203A" stroke="#FF9B80" stroke-opacity="0.55" stroke-width="2"/>
  <text x="802" y="252" fill="#FF9B80" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">ROCmBench</text>
  <text x="802" y="292" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">31 AMD-specific kernels</text>
  <text x="802" y="328" fill="#FF9B80" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">41.94%</text>
  <text x="802" y="368" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="16">Corr@3, not compile or speed</text>
  <text x="802" y="400" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Sonnet 4: 67.74% Comp@3, 1.82x</text>
  <text x="802" y="428" fill="#9BD8F5" font-family="Inter, Arial, sans-serif" font-size="15">Trained 8B: 58.06% Comp@3, 1.61x</text>

  <text x="118" y="512" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="18">Correctness is the win. Compilation and speed still belong to other models on the small ROCm set.</text>
  <text x="118" y="542" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="16">Liu, Majumder, Huang, Ouyang et al., Advanced Micro Devices</text>
</svg>
