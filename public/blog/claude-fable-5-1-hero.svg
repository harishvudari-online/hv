<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude Fable 5.1 and Mythos 5.1</title>
  <desc id="desc">Editorial illustration of one model split into a public Fable lane and a trusted Mythos lane.</desc>
  <rect width="1200" height="630" fill="#06142A"/>
  <circle cx="180" cy="90" r="240" fill="#00C2FF" fill-opacity="0.14"/>
  <circle cx="1040" cy="540" r="260" fill="#E8A87C" fill-opacity="0.16"/>
  <rect x="72" y="70" width="1056" height="490" rx="28" fill="#0C223F" stroke="#2DAEDC" stroke-opacity="0.4" stroke-width="2"/>

  <text x="118" y="128" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">One model. Two safeguard stacks.</text>
  <text x="118" y="168" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="18">Anthropic shipped Fable 5.1 to everyone and kept Mythos 5.1 behind trusted access.</text>

  <rect x="118" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#2DAEDC" stroke-opacity="0.6" stroke-width="2"/>
  <text x="148" y="258" fill="#74D7FF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Claude Fable 5.1</text>
  <rect x="148" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="148" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="166" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Generally available API SKU</text>
  <text x="166" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">$10 / $50 plus $0.25 cache reads</text>
  <text x="166" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Vulnerability find, not exploit write</text>
  <text x="148" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">claude-fable-5-1 on API, Bedrock, Google, Foundry</text>

  <rect x="622" y="210" width="460" height="270" rx="22" fill="#08203A" stroke="#E8A87C" stroke-opacity="0.7" stroke-width="2"/>
  <text x="652" y="258" fill="#E8A87C" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Claude Mythos 5.1</text>
  <rect x="652" y="282" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="334" width="400" height="40" rx="10" fill="#12355A"/>
  <rect x="652" y="386" width="400" height="40" rx="10" fill="#12355A"/>
  <text x="670" y="308" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Same weights, looser dual-use gates</text>
  <text x="670" y="360" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Cyber Verification Program</text>
  <text x="670" y="412" fill="#E2F7FF" font-family="Inter, Arial, sans-serif" font-size="16">Life Sciences Verification Program</text>
  <text x="652" y="456" fill="#DFF3FF" font-family="Inter, Arial, sans-serif" font-size="15">Vetted labs only, currently a US-first cohort</text>

  <text x="118" y="534" fill="#1BE7FF" font-family="Inter, Arial, sans-serif" font-size="20">September 2026  |  cache-read cut is the real price change</text>
</svg>
